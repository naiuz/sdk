[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "naiuz"
version = "0.1.1"
description = "The official Python client for the NeuronAI API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = [
    "neuronai",
    "sdk",
    "api-client",
    "text-to-speech",
    "speech-to-text",
    "voice-cloning",
    "transcription",
    "chat-completions",
    "embeddings",
    "uzbek",
]
dependencies = [
    "httpx>=0.23.1,<1",
    "pydantic>=2.0,<3",
]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/naiuz/sdk/tree/main/python"
Documentation = "https://github.com/naiuz/sdk/blob/main/python/api.md"
Repository = "https://github.com/naiuz/sdk"
Issues = "https://github.com/naiuz/sdk/issues"
Changelog = "https://github.com/naiuz/sdk/blob/main/python/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/naiuz"]

[tool.hatch.build.targets.sdist]
include = ["/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
xfail_strict = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PT", "RUF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Dropping async can leave the sync twins with imports out of order, nested `with` blocks, a comprehension `list()`
# could replace, or a loop of yields `yield from` could replace, none of which the async code can avoid.
"src/naiuz/_sync/**" = ["I001", "C416", "SIM117", "UP028"]
"tests/_sync/**" = ["I001", "C416", "SIM117", "UP028"]

[tool.ruff.format]
# The sync twins are written by scripts/unasync.py from the async code, which is formatted.
exclude = ["src/naiuz/_sync/**", "tests/_sync/**"]

[tool.pyright]
include = ["src", "tests", "scripts", "smoke", "examples"]
extraPaths = ["scripts"]
typeCheckingMode = "strict"

[tool.mypy]
strict = true
files = ["src", "tests", "scripts", "smoke", "examples"]
mypy_path = ["src", "scripts"]
explicit_package_bases = true
