<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice call</title>
<!--
  A voice call with an agent through a local engine, in the browser. Build the packages (npm run build in agents/),
  copy the engine's tests/fixtures/audio/*.wav beside this page, serve the repository's root, and open it:
    python3 -m http.server 8766 --bind 127.0.0.1
    http://127.0.0.1:8766/agents/client/examples/voice-call.html
  127.0.0.1 is a secure context, so the browser lets the page use the microphone. Paste a voice token from
  php artisan agents:preview-token <agent> --user=<id> --voice, choose the microphone or a recording, and start.
-->
<script type="importmap">
{
  "imports": {
    "vue": "https://unpkg.com/vue@3.5.13/dist/vue.esm-browser.prod.js",
    "@naiuz/agents": "../dist/index.js",
    "@naiuz/agents-vue": "../../vue/dist/index.js"
  }
}
</script>
<style>
:root { --bg: hsl(38 80% 98%); --fg: hsl(28 36% 14%); --card: #fff; --muted: hsl(26 24% 38%); --border: hsl(36 34% 88%); --primary: #F08600; }
* { box-sizing: border-box; }
body { margin: 0; padding: 24px 16px 48px; background: var(--bg); color: var(--fg); font: 15px/1.5 ui-sans-serif, system-ui, sans-serif; }
main { max-width: 760px; margin-inline: auto; display: grid; gap: 20px; }
h1 { margin: 0; font-size: 26px; }
label { display: grid; gap: 4px; font-size: 13px; font-weight: 600; }
input, textarea, select { font: inherit; font-weight: 400; padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); color: inherit; }
textarea { min-height: 64px; font-family: ui-monospace, monospace; font-size: 12px; }
.fields { display: grid; gap: 12px; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; }
button { font: inherit; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: inherit; cursor: pointer; }
button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.stage { display: grid; justify-items: center; gap: 10px; padding: 24px; border: 1px solid var(--border); border-radius: 20px; background: var(--card); }
#state { margin: 0; font-weight: 600; }
#transcript { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
#transcript .cut { color: var(--muted); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
#log { margin: 0; max-height: 320px; overflow: auto; padding: 12px; border-radius: 12px; background: hsl(24 12% 13%); color: hsl(36 20% 92%); font: 12px/1.5 ui-monospace, monospace; }
</style>
</head>
<body>
<main>
  <h1>Voice call</h1>
  <div class="fields">
    <label>Socket <input id="url" value="ws://127.0.0.1:8080/api/v1/realtime"></label>
    <label>Voice token <textarea id="token" spellcheck="false"></textarea></label>
    <label>Voice
      <select id="source">
        <option value="microphone">The microphone</option>
        <option value="uz-delivery.wav">uz-delivery.wav, standing in for it</option>
        <option value="uz-long.wav">uz-long.wav, standing in for it</option>
      </select>
    </label>
  </div>
  <div class="controls">
    <button id="start" class="primary">Start call</button>
    <button id="mute" disabled>Mute</button>
    <button id="end" disabled>End call</button>
    <button id="over" disabled>Speak over the reply</button>
  </div>
  <section class="stage">
    <div id="orb"></div>
    <p id="state" role="status">Not connected</p>
  </section>
  <section>
    <h2>Transcript</h2>
    <ol id="transcript"></ol>
  </section>
  <section>
    <h2>Replies' audio</h2>
    <table><thead><tr><th>Reply</th><th>Received</th><th>Played</th></tr></thead><tbody id="replies"></tbody></table>
  </section>
  <section>
    <h2>Server events</h2>
    <pre id="log"></pre>
  </section>
</main>
<script type="module">
import {createApp, h, reactive} from "vue";
import {BrowserAudio, Conversation} from "@naiuz/agents";
import {AgentOrb} from "@naiuz/agents-vue";

const $ = (id) => document.getElementById(id);
const OVER_THE_REPLY = "uz-long.wav";
// How far into the reply an armed "Speak over the reply" starts speaking.
const OVER_AFTER_MS = 600;
const view = reactive({status: "disconnected", mode: null});
let conversation = null;
let audio = null;
let voice = null;
let muted = false;
let armed = false;
let outputRate = 24_000;
const received = new Map();
const lines = new Map();
const began = performance.now();

function log(text) {
  $("log").textContent += `${((performance.now() - began) / 1000).toFixed(3).padStart(8)}  ${text}\n`;
  $("log").scrollTop = $("log").scrollHeight;
}

function orbState() {
  if (view.status === "connecting") return "connecting";
  return view.mode === null || view.mode === "text" ? "idle" : view.mode;
}

createApp({
  render: () => h(AgentOrb, {
    state: orbState(),
    level: () => conversation === null ? 0 : view.mode === "speaking" ? conversation.getOutputVolume() : conversation.getInputVolume(),
  }),
}).mount("#orb");

function render() {
  $("state").textContent = view.status === "connected" ? (view.mode ?? "connected") : view.status;
  const inCall = conversation !== null;
  $("start").disabled = inCall || view.status === "connecting";
  for (const id of ["mute", "end", "over"]) $(id).disabled = !inCall;
  $("mute").textContent = muted ? "Unmute" : "Mute";
  $("over").textContent = armed ? "Speaks over the next reply" : "Speak over the reply";
}

// The server's events, as the page's own socket hears them; playback reports and pings are counted, not listed.
let reports = 0;
class LoggedSocket extends WebSocket {
  constructor(url) {
    super(url);
    this.addEventListener("message", (event) => {
      if (typeof event.data !== "string") return;
      const {type, ...rest} = JSON.parse(event.data);
      if (type === "ping") return;
      delete rest.resume_token;
      log(`${type} ${JSON.stringify(rest).slice(0, 140)}`);
    });
    this.addEventListener("close", (event) => log(`closed ${event.code} ${event.reason} (${reports} playback reports sent)`));
  }

  send(data) {
    if (typeof data === "string" && data.includes('"playback"')) reports++;
    super.send(data);
  }
}

/** A recording into the voice that stands in for the microphone. */
async function speak(name) {
  if (voice === null) return;
  const recording = await voice.context.decodeAudioData(await (await fetch(name)).arrayBuffer());
  const source = voice.context.createBufferSource();
  source.buffer = recording;
  source.connect(voice.out);
  source.start();
  log(`(the page speaks ${name}: ${Math.round(recording.duration * 1000)} ms)`);
}

function line(key, text, cut = false) {
  let item = lines.get(key);
  if (item === undefined) {
    item = document.createElement("li");
    lines.set(key, item);
    $("transcript").append(item);
  }
  item.textContent = text;
  item.classList.toggle("cut", cut);
}

function showReplies() {
  $("replies").replaceChildren(...[...received.entries()].map(([eventId, ms]) => {
    const row = document.createElement("tr");
    for (const value of [eventId, `${Math.round(ms)} ms`, `${Math.round(audio?.playedMs(eventId) ?? 0)} ms`]) {
      const cell = document.createElement("td");
      cell.textContent = String(value);
      row.append(cell);
    }
    return row;
  }));
}
setInterval(showReplies, 250);

$("start").onclick = async () => {
  const source = $("source").value;
  // Made inside the click, as the browser wants: the recording's context, and the call's audio.
  if (source !== "microphone") {
    const context = new AudioContext();
    voice = {context, out: context.createMediaStreamDestination(), name: source, spoken: false};
  }
  audio = new BrowserAudio(voice === null ? {} : {inputStream: voice.out.stream});
  const startPlayback = audio.startPlayback.bind(audio);
  audio.startPlayback = (rate) => {
    outputRate = rate;
    startPlayback(rate);
  };
  const enqueue = audio.enqueue.bind(audio);
  audio.enqueue = (eventId, pcm) => {
    received.set(eventId, (received.get(eventId) ?? 0) + (pcm.length / outputRate) * 1000);
    enqueue(eventId, pcm);
  };
  try {
    conversation = await Conversation.startSession({
      serverUrl: $("url").value.trim(),
      token: $("token").value.trim(),
      textOnly: false,
      audio,
      WebSocket: LoggedSocket,
      onStatusChange: ({status}) => {
        view.status = status;
        render();
      },
      onModeChange: ({mode}) => {
        view.mode = mode;
        if (mode === "listening" && voice !== null && !voice.spoken) {
          voice.spoken = true;
          void speak(voice.name);
        }
        if (mode === "speaking" && armed) {
          armed = false;
          setTimeout(() => void speak(OVER_THE_REPLY), OVER_AFTER_MS);
        }
        render();
      },
      onMessage: (message) => {
        if (message.source === "ai") line(`ai-${message.eventId}`, `Agent: ${message.message}`);
        else if (message.spoken) line(`said-${message.occurredAt}`, `You: ${message.message}`);
        else line(`user-${message.messageId}`, `Typed: ${message.message}`);
      },
      onAgentResponseCorrection: ({eventId, text}) => line(`ai-${eventId}`, `Agent, as heard: ${text}`, true),
      onDisconnect: (details) => {
        log(`disconnected ${JSON.stringify(details)}`);
        conversation = null;
        void voice?.context.close();
        voice = null;
        render();
      },
      onError: (message, {code}) => log(`error ${code}: ${message}`),
    });
  } catch (error) {
    log(`the call didn't start: ${error.name}: ${error.message}`);
    void voice?.context.close();
    voice = null;
  }
  render();
};

$("mute").onclick = () => {
  muted = !muted;
  conversation?.setMicMuted(muted);
  render();
};

$("end").onclick = () => void conversation?.endSession();

$("over").onclick = () => {
  if (view.mode === "speaking") {
    void speak(OVER_THE_REPLY);
  } else {
    armed = !armed;
  }
  render();
};

render();
</script>
</body>
</html>
