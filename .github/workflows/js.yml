name: JavaScript SDK

on:
  pull_request:
    paths:
      - "js/**"
      - "spec/**"
      - ".github/workflows/js.yml"
  push:
    branches: [main]
    paths:
      - "js/**"
      - "spec/**"
      - ".github/workflows/js.yml"

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
