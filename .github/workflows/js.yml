name: JavaScript SDK

on:
  pull_request:
    paths:
      - "js/**"
      - "spec/**"
      - ".github/workflows/js.yml"
  push:
    branches: [main]
    paths:
      - "js/**"
      - "spec/**"
      - ".github/workflows/js.yml"

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node smoke/runtimes.mjs

  bun:
    name: Bun
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: js/package-lock.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - run: npm ci
      - run: npm run build
      - run: bun smoke/runtimes.mjs

  deno:
    name: Deno
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: js/package-lock.json
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm run build
      # No --allow-env beyond the temp directory's variables: the SDK must cope without reading its own.
      - run: deno run --no-prompt --allow-read --allow-write --allow-net=127.0.0.1 --allow-env=TMPDIR,TMP,TEMP smoke/runtimes.mjs
