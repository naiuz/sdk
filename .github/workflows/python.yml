name: Python SDK

on:
  pull_request:
    paths:
      - "python/**"
      - "spec/**"
      - ".github/workflows/python.yml"
  push:
    branches: [main]
    paths:
      - "python/**"
      - "spec/**"
      - ".github/workflows/python.yml"

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run mypy
      - run: uv run pytest
      - run: uv build

  lowest:
    name: Python 3.10 on the lowest dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.10"
      # pyproject.toml's floors are a promise to every app: run the tests on the oldest httpx and pydantic it allows.
      - run: uv venv
      - run: 'uv pip install --only-binary=:all: --resolution lowest-direct -e . "pytest==9.1.1" "pytest-asyncio==1.4.0"'
      - run: .venv/bin/python -m pytest -q
