name: Spec drift

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spec
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Compare the live API document with spec/openapi.json
        id: check
        run: |
          set +e
          node scripts/refresh-spec.mjs --check > drift.txt 2>&1
          code=$?
          cat drift.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then exit "$code"; fi
      - name: Open or update the drift issue
        if: steps.check.outputs.code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(printf 'The live document at https://my.neuronai.uz/docs/api.json no longer matches `spec/openapi.json`:\n\n```\n%s\n```\n\nRun `npm run refresh` in `spec/`, then bring the operation map, the fixtures and the SDKs in line.' "$(cat drift.txt)")"
          number="$(gh issue list --label spec-drift --state open --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh label create spec-drift --color D93F0B --description "The live API document differs from the pinned copy" 2>/dev/null || true
            gh issue create --title "The live API document has drifted from spec/openapi.json" --label spec-drift --body "$body"
          fi
