name: Live smoke tests

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript SDK
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      # Every test is skipped when the secret isn't set.
      - run: npm run test:smoke
        env:
          NEURONAI_SMOKE_API_KEY: ${{ secrets.NEURONAI_SMOKE_API_KEY }}

  python:
    name: Python SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
      - run: uv sync --locked
      # Every test is skipped when the secret isn't set.
      - run: uv run pytest smoke
        env:
          NEURONAI_SMOKE_API_KEY: ${{ secrets.NEURONAI_SMOKE_API_KEY }}

  php:
    name: PHP SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: php
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2, at 2.37.2
        with:
          php-version: "8.5"
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      # Every test is skipped when the secret isn't set.
      - run: vendor/bin/phpunit --testsuite smoke
        env:
          NEURONAI_SMOKE_API_KEY: ${{ secrets.NEURONAI_SMOKE_API_KEY }}
